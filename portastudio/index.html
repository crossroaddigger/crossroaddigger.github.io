<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portastudio 424 Companion</title>
<meta name="description" content="A practical guide to the TASCAM Portastudio 424 MKIII cassette 4-track in 7 languages: recording, overdubs, punch in/out, ping-pong, mixdown, track routing, tapes, head cleaning, troubleshooting and a metronome.">
<meta name="keywords" content="Tascam 424 MKIII, Portastudio, manual, mode d'emploi, handleiding, Bedienungsanleitung, manual de usuario, manuale, 4-track cassette, ping-pong, punch in, dbx">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://crossroaddigger.github.io/portastudio/">
<meta property="og:url" content="https://crossroaddigger.github.io/portastudio/">
<meta property="og:title" content="Portastudio 424 Companion">
<meta property="og:description" content="The TASCAM 424 MKIII manual rewritten step by step, in English, French, Dutch, German, Spanish, Italian and Portuguese.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://crossroaddigger.github.io/portastudio/424mkiii.jpg">
<meta property="og:image:width" content="1600"><meta property="og:image:height" content="1240">
<meta name="theme-color" content="#3c4a57">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='36' rx='5' fill='%233c4a57'/%3E%3Crect x='14' y='22' width='36' height='14' rx='3' fill='%23120806'/%3E%3Ccircle cx='23' cy='29' r='4' fill='%23ff6a3d'/%3E%3Ccircle cx='41' cy='29' r='4' fill='%23ff6a3d'/%3E%3C/svg%3E">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: une colonne façon façade du 424 — ardoise bleutée, boutons colorés comme les potards (rouge TRIM, bleu EQ, violet MID, vert EFFECT), afficheur fluorescent rouge-orangé */
:root{
  --bg:#e6e9ec; --panel:#f5f6f7; --ink:#1b232b; --muted:#56616c; --line:#c5ccd3;
  --slate:#3c4a57; --slate-ink:#eef2f5; --vfd:#d9431f; --trim:#d33b36; --eq:#3f7fc4; --mid:#7b55b8; --fx:#2e9a85;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a20; --panel:#1d252d; --ink:#e7ecf0; --muted:#98a5b1; --line:#323d48;
  --slate:#8fa3b5; --slate-ink:#10161b; --vfd:#ff6a3d; --trim:#f0605a; --eq:#6aa6e6; --mid:#a283dc; --fx:#4cc4ac; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a20; --panel:#1d252d; --ink:#e7ecf0; --muted:#98a5b1; --line:#323d48;
  --slate:#8fa3b5; --slate-ink:#10161b; --vfd:#ff6a3d; --trim:#f0605a; --eq:#6aa6e6; --mid:#a283dc; --fx:#4cc4ac; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:46px;line-height:1;margin:4px 0 6px;letter-spacing:.02em;text-wrap:balance}
h1 em{font-size:.5em;font-style:italic;color:var(--vfd);margin-left:4px;vertical-align:super}
h1 small{display:block;font-style:normal;font-size:20px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.sub{color:var(--muted);margin:0;max-width:60ch}
.counter{display:inline-flex;gap:10px;align-items:center;margin-top:12px;background:#120806;color:#ff6a3d;font-family:var(--mono);font-weight:700;padding:6px 12px;border-radius:6px;font-size:14px;letter-spacing:.12em}
.counter b{font-size:20px;text-shadow:0 0 8px rgba(255,106,61,.6)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--vfd);outline-offset:2px}
section{padding-top:18px}
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;margin:0 0 4px;text-transform:uppercase}
.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.search{width:100%;font:inherit;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:12px}
.k{font-family:var(--mono);font-weight:700;font-size:.78em;background:var(--slate);color:var(--slate-ink);padding:2px 6px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.k.r{background:var(--trim);color:#fff}
.sw{font-family:var(--mono);font-size:.8em;border:1px solid var(--line);padding:1px 5px;border-radius:3px;white-space:nowrap}

.guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.guide summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide .tag{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;min-width:74px}
.guide .gt{font-weight:700;flex:1;min-width:0}
.guide .done{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 auto}
.guide.is-done .done{background:var(--fx)}
.guide[open] summary{border-bottom:1px solid var(--line)}
.guide .body{padding:12px 16px 16px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink)}
ol.steps li>span{min-width:0}
.note{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--eq);background:color-mix(in srgb,var(--eq) 10%,transparent);border-radius:0 6px 6px 0;font-size:15px}
.note.warn{border-color:var(--trim);background:color-mix(in srgb,var(--trim) 9%,transparent)}
.mark{margin-top:12px;font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}

.face{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
.zone{font:inherit;text-align:left;cursor:pointer;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:10px;min-width:0}
.zone b{display:block;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.zone i{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--mono)}
.zone[aria-pressed="true"]{border:1.5px solid var(--vfd);background:color-mix(in srgb,var(--vfd) 7%,transparent)}
.knobs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.knobs span{width:14px;height:14px;border-radius:50%;background:var(--c)}
.z-ch{grid-column:span 2;grid-row:span 2}.z-56{grid-column:span 1;grid-row:span 2}.z-78{grid-column:span 1;grid-row:span 2}
.z-cas{grid-column:span 2}.z-rf{grid-column:span 2}
.z-vfd{grid-column:span 2}.z-loc{grid-column:span 2}.z-tp{grid-column:span 2}.z-rear{grid-column:span 6}
.detail{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.detail h3{font-family:var(--display);font-size:22px;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
dl.ctl{margin:0;display:grid;gap:8px}
dl.ctl div{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:10px}
dl.ctl dt,dl.ctl dd{min-width:0}
dl.ctl dd{margin:0}
@media (max-width:520px){
  .face{grid-template-columns:repeat(2,1fr)}
  .z-ch,.z-rear,.z-cas,.z-rf{grid-column:span 2}.z-56,.z-78,.z-vfd,.z-loc,.z-tp{grid-column:span 1}
  .z-ch,.z-56,.z-78{grid-row:auto}.z-tp{grid-column:span 2}
  dl.ctl div{grid-template-columns:1fr;gap:2px}
}

.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
h3.sub{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 8px}

.routes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.route{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.route b{display:block;font-family:var(--display);font-size:22px}
.route span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.route.l b{color:var(--eq)}.route.r b{color:var(--trim)}
@media (max-width:420px){.routes{grid-template-columns:repeat(2,1fr)}}

.calc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
.out{font-family:var(--mono);font-size:15px}
.out b{font-size:26px;color:var(--vfd);font-variant-numeric:tabular-nums}

.metro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
.lcd{background:#120806;color:#ff6a3d;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bpm{font-family:var(--mono);font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,106,61,.5)}
.bpm small{font-size:14px;margin-left:6px;opacity:.7}
.beats{display:flex;gap:6px;flex-wrap:wrap}
.beats i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;opacity:.45}
.beats i.on{background:#ff6a3d;opacity:1}
.beats i.on.first{background:#ffd2c2;border-color:#ffd2c2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-weight:600;min-width:70px}
input[type=range]{flex:1;min-width:160px;accent-color:var(--vfd)}
.btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.big{background:var(--slate);color:var(--slate-ink);border-color:var(--slate);min-width:120px}
.btn.big.playing{background:var(--trim);border-color:var(--trim);color:#fff}
.step{font:inherit;font-weight:700;width:42px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.empty{color:var(--muted);padding:12px 0}
footer{margin-top:28px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 0;font-size:14px}
.topbar a{color:var(--muted);text-decoration:none;font-weight:600}
.topbar a:hover{color:var(--ink)}
.topbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.langsel select{font:inherit;font-size:14px;font-weight:600;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app[aria-busy="true"]{min-height:80vh}
.hero{margin:16px 0 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--slate)}
.hero img{display:block;width:100%;height:auto;aspect-ratio:1600/1240;max-width:100%}
.hero figcaption{font-size:13px;color:var(--muted);background:var(--panel);padding:8px 12px;border-top:1px solid var(--line)}
.bmc{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;background:#ffdd00;color:#1b1a14;border-radius:999px;padding:8px 14px;border:1px solid #e6c600}
.bmc:hover{filter:brightness(.96)}
.bmc-float{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.support{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.support p{margin:0;max-width:52ch;min-width:0}
@media (max-width:520px){.bmc-float .lbl{display:none}.bmc-float{padding:10px 12px}}
.topbar a{white-space:nowrap}
@media (max-width:520px){.topbar .right .bmc{display:none}}
</style>

</head>
<body>
<div class="wrap" id="app" aria-busy="true">
<div class="topbar"><a href="/" id="back">← Mellow Box</a>
  <div class="right"><label class="langsel"><span class="sr" id="langlbl">Language</span><select id="lang"></select></label>
  <a class="bmc" href="https://buymeacoffee.com/mellowbox" target="_blank" rel="noopener">☕ Buy me a coffee</a></div></div>
<header>
  <div class="brand" data-t="brand"></div>
  <h1>Portastudio 424<em>mkIII</em><small data-t="kicker"></small></h1>
  <p class="sub" data-t="intro"></p>
  <div class="counter" aria-hidden="true">COUNTER <b>0000</b> · dbx</div>
  <figure class="hero"><picture><source srcset="424mkiii.webp" type="image/webp"><img id="photo" src="424mkiii.jpg" width="1600" height="1240" alt="TASCAM Portastudio 424 MKIII" fetchpriority="high"></picture><figcaption data-t="photoCap"></figcaption></figure>
</header>

<nav role="tablist" id="tabs">
  <button role="tab" data-tab="guides" aria-selected="true"></button>
  <button role="tab" data-tab="panneau" aria-selected="false"></button>
  <button role="tab" data-tab="routage" aria-selected="false"></button>
  <button role="tab" data-tab="cassette" aria-selected="false"></button>
  <button role="tab" data-tab="depannage" aria-selected="false"></button>
  <button role="tab" data-tab="metronome" aria-selected="false"></button>
</nav>

<section id="guides" role="tabpanel">
  <h2 data-t="guidesH"></h2>
  <p class="lead" data-t="guidesLead"></p>
  <input class="search" id="q" type="search">
  <div id="glist"></div>
  <p class="empty" id="gempty" data-t="searchEmpty" hidden></p>
</section>

<section id="panneau" role="tabpanel" hidden>
  <h2 data-t="panelH"></h2>
  <p class="lead" data-t="panelLead"></p>
  <div class="face" id="face">
    <button class="zone z-ch" data-z="ch"><b></b><i>TRIM · INPUT · EQ · EFFECT · PAN · fader</i>
      <div class="knobs" aria-hidden="true"><span style="--c:var(--trim)"></span><span style="--c:var(--eq)"></span><span style="--c:var(--mid)"></span><span style="--c:var(--eq)"></span><span style="--c:var(--fx)"></span><span style="--c:var(--fx)"></span></div></button>
    <button class="zone z-56" data-z="v56"><b></b><i>INPUT 1/3/5 · 2/4/6</i></button>
    <button class="zone z-78" data-z="v78"><b></b><i>LEVEL · ASSIGN · MONITOR · MASTER</i></button>
    <button class="zone z-cas" data-z="cas"><b></b><i>dbx · TAPE SPEED</i></button>
    <button class="zone z-rf" data-z="rf"><b></b><i>DIRECT · SAFE · BUSS × 4</i></button>
    <button class="zone z-vfd" data-z="vfd"><b></b><i>METER · COUNTER</i></button>
    <button class="zone z-loc" data-z="loc"><b></b><i>REHEARSAL · AUTO PUNCH · LOC · RTZ</i></button>
    <button class="zone z-tp" data-z="tp"><b></b><i>REW · F FWD · STOP · PLAY · RECORD</i></button>
    <button class="zone z-rear" data-z="rear"><b></b><i>INPUT · LINE / MONITOR OUT · EFFECT SEND · TAPE OUT · PHONES</i></button>
  </div>
  <div class="detail" id="zdetail"></div>
</section>

<section id="routage" role="tabpanel" hidden>
  <h2 data-t="routeH"></h2>
  <p class="lead" data-t="routeLead"></p>
  <div class="routes" id="routes"></div>
  <div class="tbl"><table id="rftable"></table></div>
  <h3 class="sub" data-t="combosH"></h3>
  <div class="tbl"><table id="combos"></table></div>
</section>

<section id="cassette" role="tabpanel" hidden>
  <h2 data-t="casH"></h2>
  <p class="lead" data-t="casLead"></p>
  <div class="calc">
    <div class="row"><label data-t="calcTape"></label><div class="seg" id="len"><button data-v="46" aria-pressed="false">C-46</button><button data-v="60" aria-pressed="true">C-60</button><button data-v="90" aria-pressed="false">C-90</button></div></div>
    <div class="row"><label data-t="calcSpeed"></label><div class="seg" id="spd"><button data-v="high" aria-pressed="true"></button><button data-v="normal" aria-pressed="false"></button></div></div>
    <div class="out" aria-live="polite"><span data-t="calcOut"></span> <b id="dur"></b> · <span id="bw"></span></div>
  </div>
  <div class="tbl"><table id="tips"></table></div>
  <h3 class="sub" data-t="specsH"></h3>
  <div class="tbl"><table id="specs"></table></div>
</section>

<section id="depannage" role="tabpanel" hidden>
  <h2 data-t="troubleH"></h2>
  <p class="lead" data-t="troubleLead"></p>
  <div id="tlist"></div>
</section>

<section id="metronome" role="tabpanel" hidden>
  <h2 data-t="metroH"></h2>
  <p class="lead" data-t="metroLead"></p>
  <div class="metro">
    <div class="lcd" aria-live="polite">
      <div class="bpm"><span id="bpmv">96</span><small>BPM</small></div>
      <div class="beats" id="beats"></div>
    </div>
    <div class="row">
      <label for="bpm" data-t="tempo"></label>
      <button class="step" id="minus">−</button>
      <input type="range" id="bpm" min="30" max="250" value="96">
      <button class="step" id="plus">+</button>
    </div>
    <div class="row">
      <label for="beat" data-t="beats"></label>
      <input type="range" id="beat" min="1" max="12" value="4">
      <span class="k" id="beatv">4</span>
    </div>
    <div class="row">
      <button class="btn big" id="play"></button>
      <button class="btn" id="tap" data-t="tap"></button>
    </div>
  </div>
</section>

<div class="support"><p data-t="support"></p><a class="bmc" href="https://buymeacoffee.com/mellowbox" target="_blank" rel="noopener">☕ Buy me a coffee</a></div>
<footer data-t="footer"></footer>
</div>
<a class="bmc bmc-float" href="https://buymeacoffee.com/mellowbox" target="_blank" rel="noopener" aria-label="Buy me a coffee">☕<span class="lbl">Buy me a coffee</span></a>

<script>
/* Helpers used by the language files (lang/xx.js) */
const K=s=>`<span class="k">${s}</span>`, KR=s=>`<span class="k r">${s}</span>`, S=s=>`<span class="sw">${s}</span>`;
window.P424=window.P424||{};
const LANGS={en:"English",fr:"Français",nl:"Nederlands",de:"Deutsch",es:"Español",it:"Italiano",pt:"Português"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* Same language key as the Mellow Box homepage, so a choice made there carries over */
let LANG=(()=>{let q=null,s=null;try{q=new URLSearchParams(location.search).get("lang")}catch(e){}
  try{s=localStorage.getItem("mb-lang")}catch(e){}
  if(q&&LANGS[q])return q; if(s&&LANGS[s])return s;
  for(const l of (navigator.languages||[navigator.language||""])){const k=String(l||"").slice(0,2).toLowerCase();if(LANGS[k])return k}
  return "en"})();
let T=null, done=store.get("p424-done",{});

function loadLang(l){return new Promise(res=>{if(P424[l])return res(P424[l]);
  const sc=document.createElement("script");sc.src="lang/"+l+".js?v=1";sc.onload=()=>res(P424[l]);sc.onerror=()=>res(null);document.head.appendChild(sc)})}

/* ---- tabs ---- */
const tabs=[...document.querySelectorAll("#tabs button")], valid=tabs.map(b=>b.dataset.tab);
function show(id,fromClick){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id));
  document.querySelectorAll("section[role=tabpanel]").forEach(s=>s.hidden=s.id!==id);
  if(fromClick&&location.hash!=="#"+id) history.replaceState(null,"",location.pathname+location.search+"#"+id); store.set("p424-tab",id)}
tabs.forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab,true)));
addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(valid.includes(h)) show(h)});

/* ---- render everything from T ---- */
const rows=(head,list,fmt)=>(head?`<thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`:"")+`<tbody>${list.map(r=>`<tr>${r.map((c,i)=>`<td${fmt&&fmt[i]?` class="${fmt[i]}"`:""}>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;
function render(){
  const u=T.ui;
  document.documentElement.lang=LANG; document.title=u.title;
  document.querySelector('meta[name="description"]').content=u.meta;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=u[e.dataset.t]; if(v!=null) e.innerHTML=v});
  document.getElementById("langlbl").textContent=u.language;
  document.getElementById("photo").alt=u.photoAlt;
  document.getElementById("lang").setAttribute("aria-label",u.language);
  document.getElementById("tabs").setAttribute("aria-label",u.sections);
  tabs.forEach(b=>b.textContent=u.tabs[b.dataset.tab]);
  const q=document.getElementById("q"); q.placeholder=u.searchPh; q.setAttribute("aria-label",u.searchPh); q.value="";
  document.getElementById("gempty").hidden=true;
  // guides
  const gl=document.getElementById("glist"), wasOpen=[...gl.querySelectorAll("details[open]")].map(d=>d.id);
  gl.innerHTML=T.guides.map(g=>`<details class="guide${done[g.id]?" is-done":""}" id="g-${g.id}" data-kw="${(g.t+" "+g.kw+" "+g.tag).toLowerCase().replace(/"/g,"")}">
    <summary><span class="tag">${g.tag}</span><span class="gt">${g.t}</span><span class="done" aria-hidden="true"></span></summary>
    <div class="body"><ol class="steps">${g.steps.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>
    ${g.note?`<p class="note">${g.note}</p>`:""}${g.warn?`<p class="note warn">${g.warn}</p>`:""}
    <button class="mark" data-id="${g.id}">${done[g.id]?u.markUndo:u.markDone}</button></div></details>`).join("");
  (wasOpen.length?wasOpen:["g-setup"]).forEach(id=>{const d=document.getElementById(id); if(d) d.open=true});
  // panel
  document.querySelectorAll(".zone").forEach(b=>b.querySelector("b").textContent=T.zones[b.dataset.z][0]);
  zone(document.querySelector('.zone[aria-pressed="true"]')?.dataset.z||"rf");
  // routing
  document.getElementById("routes").innerHTML=[1,2,3,4].map(n=>{const l=n%2===1;
    return `<div class="route ${l?"l":"r"}"><b>${u.track} ${n}</b><span>BUSS ${l?"L":"R"} · PAN ${l?u.left:u.right}</span></div>`}).join("");
  document.getElementById("rftable").innerHTML=rows(u.rfHead,T.rf.map(([a,b])=>[S(a),b]));
  document.getElementById("combos").innerHTML=rows(u.combosHead,T.combos);
  // cassette
  const sp=document.querySelectorAll("#spd button"); sp[0].textContent=u.speedHigh; sp[1].textContent=u.speedNormal;
  document.getElementById("tips").innerHTML=rows(u.tipsHead,T.tips);
  document.getElementById("specs").innerHTML=rows(null,T.specs,[null,"num"]);
  calc();
  // trouble
  document.getElementById("tlist").innerHTML=T.trouble.map(x=>`<details class="guide"><summary><span class="gt">${x.t}</span></summary><div class="body"><p style="margin:0">${x.a}</p></div></details>`).join("");
  // metronome
  document.getElementById("minus").setAttribute("aria-label",u.minus);
  document.getElementById("plus").setAttribute("aria-label",u.plus);
  playB.textContent=timer?u.stop:u.start;
  document.getElementById("app").removeAttribute("aria-busy");
}

/* guides interactions */
const glist=document.getElementById("glist");
glist.addEventListener("click",e=>{const b=e.target.closest(".mark"); if(!b) return; const id=b.dataset.id;
  done[id]=!done[id]; store.set("p424-done",done);
  document.getElementById("g-"+id).classList.toggle("is-done",!!done[id]);
  b.textContent=done[id]?T.ui.markUndo:T.ui.markDone});
document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll("#glist .guide").forEach(d=>{const m=!q||d.dataset.kw.includes(q)||d.textContent.toLowerCase().includes(q); d.hidden=!m; if(m)n++; if(q&&m) d.open=true});
  document.getElementById("gempty").hidden=n>0});

/* panel */
const zd=document.getElementById("zdetail");
function zone(z){document.querySelectorAll(".zone").forEach(b=>b.setAttribute("aria-pressed",b.dataset.z===z));
  const [t,list]=T.zones[z]; zd.innerHTML=`<h3>${t}</h3><dl class="ctl">${list.map(([k,v])=>`<div><dt>${K(k)}</dt><dd>${v}</dd></div>`).join("")}</dl>`}
document.getElementById("face").addEventListener("click",e=>{const b=e.target.closest(".zone"); if(b) zone(b.dataset.z)});

/* tape length: one side, C-60 = 15 min at HIGH, 30 at NORMAL */
let len=60,spd="high";
function calc(){if(!T) return; const m=(len/4)*(spd==="high"?1:2);
  document.getElementById("dur").textContent=(Number.isInteger(m)?String(m):m.toFixed(1).replace(".",T.ui.dec))+" min";
  document.getElementById("bw").textContent=spd==="high"?"40 Hz–16 kHz":"40 Hz–10 kHz"}
function seg(id,set){const el=document.getElementById(id); el.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); set(b.dataset.v); calc()})}
seg("len",v=>len=+v); seg("spd",v=>spd=v);

/* metronome */
const bpmI=document.getElementById("bpm"),beatI=document.getElementById("beat"),bpmV=document.getElementById("bpmv"),beatV=document.getElementById("beatv"),beatsEl=document.getElementById("beats"),playB=document.getElementById("play");
let ctx=null,timer=null,next=0,count=0,taps=[];
const saved=store.get("p424-metro",{bpm:96,beat:4}); bpmI.value=saved.bpm; beatI.value=saved.beat;
function drawBeats(a){const n=+beatI.value; beatsEl.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i===a?"on":""}${i===0?" first":""}"></i>`).join("")}
function sync(){bpmV.textContent=bpmI.value; beatV.textContent=beatI.value; drawBeats(-1); store.set("p424-metro",{bpm:+bpmI.value,beat:+beatI.value})}
bpmI.oninput=sync; beatI.oninput=sync;
document.getElementById("minus").onclick=()=>{bpmI.value=Math.max(30,+bpmI.value-1);sync()};
document.getElementById("plus").onclick=()=>{bpmI.value=Math.min(250,+bpmI.value+1);sync()};
function click(t,acc){const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=acc?1600:1000;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(acc?0.9:0.5,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.06)}
function sched(){while(next<ctx.currentTime+0.1){const n=+beatI.value,b=count%n; click(next,b===0&&n>1);
  setTimeout(()=>drawBeats(b),Math.max(0,(next-ctx.currentTime)*1000)); next+=60/+bpmI.value; count++}}
playB.onclick=()=>{if(timer){clearInterval(timer);timer=null;playB.textContent=T.ui.start;playB.classList.remove("playing");drawBeats(-1);return}
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); ctx.resume()}catch(e){playB.textContent=T.ui.noSound;return}
  count=0; next=ctx.currentTime+0.05; timer=setInterval(sched,25); playB.textContent=T.ui.stop; playB.classList.add("playing")};
document.getElementById("tap").onclick=()=>{const now=performance.now(); taps=taps.filter(t=>now-t<2500); taps.push(now);
  if(taps.length>1){const d=(taps[taps.length-1]-taps[0])/(taps.length-1); bpmI.value=Math.min(250,Math.max(30,Math.round(60000/d))); sync()}};
sync();

/* language picker */
const sel=document.getElementById("lang");
sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
async function setLang(l,save){let d=await loadLang(l); if(!d){l="en"; d=await loadLang("en")}
  LANG=l; T=d; sel.value=l; if(save){try{localStorage.setItem("mb-lang",l)}catch(e){}} render()}
sel.addEventListener("change",()=>setLang(sel.value,true));

const h0=location.hash.slice(1), t0=store.get("p424-tab","guides");
show(valid.includes(h0)?h0:(valid.includes(t0)?t0:"guides"));
setLang(LANG,false);
</script>
</body>
</html>
